
# ConfigMap for agent_eta
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent_eta-config
  namespace: agent_eta
  labels:
    app.kubernetes.io/name: agent_eta
    app.kubernetes.io/component: backend
data:
  # Application settings
  ENVIRONMENT: "production"
  DEBUG: "false"
  PROJECT_NAME: "agent_eta"
  API_V1_STR: "/api/v1"
  TIMEZONE: "UTC"

  # PostgreSQL settings
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "agent_eta"
  # Redis settings
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Celery settings
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/0"
  # Logfire settings
  LOGFIRE_SERVICE_NAME: "agent_eta"
  LOGFIRE_ENVIRONMENT: "production"
  # Milvus settings
  MILVUS_HOST: "milvus-service"
  MILVUS_PORT: "19530"
  # CORS settings (adjust for your domain)
  CORS_ORIGINS: '["https://agent_eta.example.com"]'
