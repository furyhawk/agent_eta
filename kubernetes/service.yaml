
# Service for agent_eta Backend
apiVersion: v1
kind: Service
metadata:
  name: agent_eta-backend
  namespace: agent_eta
  labels:
    app.kubernetes.io/name: agent_eta
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8500
      targetPort: 8500
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: agent_eta
    app.kubernetes.io/component: backend
