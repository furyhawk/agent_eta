
# Production configuration
# with external Traefik (connect to traefik-public network)
#
# Usage:
#   1. Fill backend/.env with real production secrets (cp backend/.env.example
#      backend/.env if it doesn't exist yet). The same file is used for dev and
#      prod — there is no separate .env.prod.
#   2. Run: make prod   (or: docker compose --env-file backend/.env -f docker-compose.prod.yml up -d)
#
# Prerequisites:
#   1. Create external traefik-public network: docker network create traefik-public
#   2. Run your Traefik instance connected to traefik-public network
#   3. Configure backend/.env with DOMAIN

services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_eta_backend
    volumes:
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8500 --workers 4
    networks:
      - traefik-public
      - backend-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent_eta-api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.agent_eta-api.entrypoints=websecure"
      - "traefik.http.routers.agent_eta-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent_eta-api.middlewares=agent_eta-security-headers@docker"
      - "traefik.http.services.agent_eta-api.loadbalancer.server.port=8500"
      - "traefik.docker.network=traefik-public"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M


  db:
    image: postgres:16-alpine
    container_name: agent_eta_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-agent_eta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO external ports - only accessible within backend-internal network
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: agent_eta_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # NO external ports - only accessible within backend-internal network
    volumes:
      - redis_data:/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    container_name: agent_eta_etcd
    volumes:
      - etcd_data:/var/lib/etcd
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: agent_eta_minio
    command: server /data --console-address ":9001"
    # NO external ports - only accessible within backend-internal network
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme}
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  milvus:
    image: milvusdb/milvus:v2.6.22
    container_name: agent_eta_milvus
    command: ["milvus", "run", "standalone"]
    # NO external ports - only accessible within backend-internal network
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      # Milvus standalone needs querycoord/datacoord/proxy to converge before
      # /healthz returns 200 — first boot can take 60-180s on Apple Silicon.
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  celery_worker:
    image: agent_eta_backend:dev
    container_name: agent_eta_celery_worker
    volumes:
      - media_data:/app/media
    command: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend-internal
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  celery_beat:
    image: agent_eta_backend:dev
    container_name: agent_eta_celery_beat
    volumes:
      - beat_data:/app/data
    command: celery -A app.worker.celery_app beat --schedule=/app/data/celerybeat-schedule --loglevel=warning
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend-internal
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  flower:
    image: agent_eta_backend:dev
    container_name: agent_eta_flower
    command: celery -A app.worker.celery_app flower --port=5555
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    networks:
      - traefik-public
      - backend-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent_eta-flower.rule=Host(`flower.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.agent_eta-flower.entrypoints=websecure"
      - "traefik.http.routers.agent_eta-flower.tls.certresolver=letsencrypt"
      - "traefik.http.services.agent_eta-flower.loadbalancer.server.port=5555"
      - "traefik.docker.network=traefik-public"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so they
      # must be build args — an `environment:` entry cannot override them, and
      # changing one needs a rebuild (docker compose -f docker-compose.prod.yml
      # build --no-cache frontend). Every value here has to be reachable from
      # the BROWSER, not from inside the compose network.
      args:
        # The proxy terminates TLS and serves the backend on api.DOMAIN.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN:-localhost}}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://api.${DOMAIN:-localhost}}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN:-localhost}}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-50}
        - NEXT_PUBLIC_OAUTH_PROVIDERS=google
        - NEXT_PUBLIC_RAG_ENABLED=true
    container_name: agent_eta_frontend
    environment:
      - NODE_ENV=production
      # Server-side only: resolved inside the compose network by the Next server.
      - BACKEND_URL=http://app:8500
      # The auth cookies are Secure in production, and a browser discards a
      # Secure cookie that arrives over plain HTTP — login then "works" while
      # every request after it is 401. Serve this over TLS, or set
      # COOKIE_SECURE=false if it really is http:// on a trusted network.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent_eta-frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.agent_eta-frontend.entrypoints=websecure"
      - "traefik.http.routers.agent_eta-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.agent_eta-frontend.middlewares=agent_eta-security-headers@docker"
      - "traefik.http.services.agent_eta-frontend.loadbalancer.server.port=3500"
      - "traefik.docker.network=traefik-public"
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  traefik-public:
    external: true
  backend-internal:
    driver: bridge
    internal: true

volumes:
  media_data:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  beat_data:
